name: Verify fact registry and toolkit

on:
  pull_request:
    paths:
      - "app/**"
      - "cli/**"
      - "obsidian-vault/**"
      - "plugin/**"
      - "package.json"
      - ".github/workflows/verified-facts.yml"
  push:
    branches: [main, feat/verified-fact-registry]
    paths:
      - "app/**"
      - "cli/**"
      - "obsidian-vault/**"
      - "plugin/**"
      - "package.json"
      - ".github/workflows/verified-facts.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: npm run test:setup
      - run: npm --prefix app test
