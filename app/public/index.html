<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Forge — Case Workspace</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/brand/tokens.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="side">
    <div class="logo"><img src="/brand/logo.svg" alt="Case Forge" width="228" height="65"></div>
    <button class="case-switch" id="current-matter" type="button" aria-label="Current matter. Choose a different case folder.">
      <span class="lbl">Current matter</span>
      <span class="nm"><span id="case-name">Loading…</span>
        <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>

    <div class="navlbl">Overview</div>
    <button type="button" class="nav" data-view="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14v18H5zM9 3v18M12 8h4M12 12h4"/></svg>Case journal</button>
    <button type="button" class="nav on" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Case overview</button>
    <button type="button" class="nav" data-view="timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round"/></svg>Case Timeline<span class="ct" id="count-timeline">0</span></button>
    <button type="button" class="nav" data-view="evidence"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18"/></svg>Evidence Matrix<span class="ct" id="count-evidence">0</span></button>
    <button type="button" class="nav" data-view="patterns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4" stroke-linecap="round" stroke-linejoin="round"/></svg>Patterns<span class="ct alert" id="count-patterns">0</span></button>
    <button type="button" class="nav" data-view="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0M16 7a3 3 0 010 6M21 20a6 6 0 00-4-5.7" stroke-linecap="round"/></svg>People<span class="ct" id="count-people">0</span></button>

    <div class="navlbl">Build</div>
    <button type="button" class="nav" data-view="documents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v5h5M7 3h8l5 5v13H7z" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 13h6M10 17h6" stroke-linecap="round"/></svg>Evidence Vault</button>
    <button type="button" class="nav" data-view="exports">Document Studio</button>
    <button type="button" class="nav" data-view="legal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>Legal Research</button>

    <div class="foot"><span class="lk"></span>Files stay local · you choose your AI</div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="bar">
      <div>
        <div class="crumb"><b id="crumb-view">Dashboard</b> · <span id="case-court">local vault</span></div>
        <h1 id="view-title">Case overview</h1>
      </div>
      <div class="sp"></div>
      <input class="search" id="search" placeholder="Search timeline…" aria-label="Search timeline" autocomplete="off">
      <button class="ask" id="ask-claude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z" stroke-linejoin="round"/></svg>Connect <span class="gd">AI</span></button>
    </div>

    <div class="banner" id="data-banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01" stroke-linecap="round"/></svg>
      <span><b>Sample case loaded.</b> This is fictional demo data. Imports stay local; cloud analysis sends only the document text you explicitly select.</span>
    </div>

    <div class="content" id="view"></div>
  </main>
</div>

<!-- Modal host -->
<div class="modal-back" id="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-x" id="modal-x" aria-label="Close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Print host (for PDF export) -->
<div id="print-area"></div>

<script src="/app.js" type="module"></script>
</body>
</html>
